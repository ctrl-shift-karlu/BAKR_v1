<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#143a2b">
    <meta name="robots" content="noindex">
    <title>BAKR is unreachable | BAKR</title>
    <link rel="icon" type="image/png" href="images/logo/bakr-logo.png">
    <link rel="stylesheet" href="css/bakr-offline.css">
</head>
<body>
<!-- Shown by the service worker (public/sw.js) when BAKR cannot be reached: no connection, the server's network
     (Tailscale) is off, or the server is down. "Try again" reloads the page that was asked for (empty href). -->
<main class="off-card" aria-labelledby="off-title">
    <img src="images/logo/bakr-logo.png" alt="BAKR logo" width="72" height="72">
    <h1 id="off-title">BAKR is unreachable</h1>
    <p>BAKR is unreachable or down at the moment. Please try again later.</p>
    <a class="off-btn" href="">Try again</a>
</main>
</body>
</html>
